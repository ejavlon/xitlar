spring.application.name=xitlar-test
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xitlar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.dbcp2.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

token.secret.key=test-jwt-secret-key-32-chars-long-for-testing-purposes-only-12345
admin.default.username=ejavlon
admin.default.password=root

app.storage.path=${STORAGE_PATH:./target/test-storage}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
